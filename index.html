    --r:12px; --r2:18px;
    --serif:Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --ease:cubic-bezier(.32,.72,0,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  .mono{display:block;background:var(--mono) center/contain no-repeat;flex:none}
  body{background:var(--branco);color:var(--preto);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
  h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.015em;line-height:1.1}
  h1{font-size:34px}
  h2{font-size:22px}
  input,select,textarea,button{font:inherit;color:inherit}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--preto);color:var(--branco)}
  :focus-visible{outline:2px solid var(--preto);outline-offset:2px;border-radius:4px}

  /* navegação */
  .lateral{position:fixed;inset:0 auto 0 0;width:236px;border-right:1px solid var(--linha);padding:32px 20px;display:none;flex-direction:column}
  .marca{padding:0 12px;text-align:center}
  .marca .mono{height:38px;width:31px;margin:0 auto}
  .marca b{display:block;font-family:var(--serif);font-size:21px;font-weight:400;margin-top:12px;letter-spacing:.01em}
  .etiqueta{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--cinza)}
  .menu{margin-top:38px;display:flex;flex-direction:column;gap:2px}
  .menu a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r);color:var(--cinza);font-size:14px;transition:background .2s var(--ease),color .2s var(--ease)}
  .menu a:hover{background:var(--nevoa);color:var(--preto)}
  .menu a.ativo{background:var(--verde-fundo);color:var(--verde);font-weight:600}
  .nota{margin-top:auto;padding:0 12px;font-size:12px;color:var(--cinza)}

  .topoCel{position:fixed;inset:0 0 auto 0;z-index:20;display:flex;align-items:center;gap:10px;height:54px;padding:0 20px;border-bottom:1px solid var(--linha);background:rgba(255,255,255,.92);backdrop-filter:blur(16px)}
  .topoCel .mono{height:26px;width:21px}
  .topoCel span{font-family:var(--serif);font-size:17px}
  .rodape{position:fixed;inset:auto 0 0 0;z-index:20;display:flex;border-top:1px solid var(--linha);background:rgba(255,255,255,.92);backdrop-filter:blur(16px);padding-bottom:env(safe-area-inset-bottom)}
  .rodape a{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 0 13px;font-size:11px;color:var(--cinza);transition:color .2s var(--ease)}
  .rodape a.ativo{color:var(--verde);font-weight:600}

  main{padding:82px 20px 96px}
  .area{max-width:940px;margin:0 auto}
  @media(min-width:1024px){
    .lateral{display:flex} .rodape,.topoCel{display:none}
    main{margin-left:236px;padding:48px 40px 48px}
  }

  .cabecalho{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;border-bottom:1px solid var(--linha);padding-bottom:20px;margin-bottom:28px}
  .sub{color:var(--cinza);font-size:13px;margin-top:6px}

  /* peças */
  .cartao{border:1px solid var(--linha);border-radius:var(--r2);background:var(--branco)}
  .grade3{display:grid;gap:14px;grid-template-columns:1fr}
  @media(min-width:640px){.grade3{grid-template-columns:repeat(3,1fr)}}
  .num{font-family:var(--serif);font-size:44px;margin-top:12px;font-variant-numeric:tabular-nums}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:999px;padding:9px 17px;font-size:14px;font-weight:500;cursor:pointer;background:var(--verde);color:var(--branco);transition:background .2s var(--ease),opacity .2s var(--ease)}
  .btn:hover{background:#424c42}
  .btn.claro{background:var(--branco);color:var(--preto);border:1px solid var(--linha2)}
  .btn.claro:hover{background:var(--nevoa)}
  .btn.texto{background:none;color:var(--cinza);padding:7px 11px}
  .btn.texto:hover{background:var(--nevoa);color:var(--preto)}
  .btn.perigo:hover{color:#b42318;background:#fef3f2}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  .campo{display:block;margin-bottom:16px}
  .campo>span{display:block;font-size:12px;font-weight:600;color:var(--grafite);margin-bottom:6px}
  .campo input,.campo select,.campo textarea{width:100%;border:1px solid var(--linha);background:var(--nevoa);border-radius:var(--r);padding:10px 13px;font-size:14px;transition:border-color .2s var(--ease),background .2s var(--ease)}
  .campo textarea{min-height:84px;resize:vertical}
  .campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--linha2);background:var(--branco)}
  .dupla{display:grid;gap:0 16px;grid-template-columns:1fr}
  @media(min-width:560px){.dupla{grid-template-columns:1fr 1fr}}
  .marcar{display:flex;align-items:center;gap:9px;font-size:14px;margin-bottom:16px;cursor:pointer}
  .marcar input{width:17px;height:17px;accent-color:var(--verde)}

  .busca{position:relative;margin-bottom:22px}
  .busca input{width:100%;border:1px solid var(--linha);background:var(--nevoa);border-radius:999px;padding:11px 18px 11px 42px;font-size:14px}
  .busca input:focus{outline:none;border-color:var(--linha2);background:var(--branco)}
  .busca svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--cinza)}

  .selo{display:inline-block;background:var(--verde-fundo);color:var(--verde);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;vertical-align:2px;margin-left:7px}
  .selo.perigo{background:#fef3f2;color:#b42318} .vazio{border:1px dashed var(--linha);border-radius:var(--r2);padding:56px 24px;text-align:center}
  .vazio p{color:var(--cinza);font-size:14px;margin-top:8px}

  /* lista de pacientes */
  .lista{display:flex;flex-direction:column}
  .linha{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:var(--r);cursor:pointer;transition:background .2s var(--ease)}
  .linha:hover{background:var(--nevoa)}
  .ret{width:42px;height:42px;border-radius:999px;object-fit:cover;background:var(--nevoa);border:1px solid var(--linha);flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:16px;color:var(--cinza)}
  .linha b{font-weight:600;font-size:14.5px}

/* ---------- banco ---------- */
/* Tudo pendurado embaixo do usuário: usuarios/{uid}/pacientes, /atendimentos...
   A regra no Firebase libera só o dono, então ninguém alcança o que é seu. */
let UID = null;
const col = n => collection(bd, 'usuarios', UID, n);
const ref = (n, i) => doc(bd, 'usuarios', UID, n, i);
/* a anamnese é uma por paciente, então a chave dela é o id da paciente */
const chave = (n, r) => n === 'anamneses' ? r.pacienteId : r.id;

const DB = {
  async ler(n, i){ const s = await getDoc(ref(n, i)); return s.exists() ? s.data() : undefined; },
  async todos(n){ return (await getDocs(col(n))).docs.map(d => d.data()); },
  async por(n, campo, valor){ return (await getDocs(query(col(n), where(campo, '==', valor)))).docs.map(d => d.data()); },
  async contar(n){ return (await getDocs(col(n))).size; },
  async gravar(n, r){ await setDoc(ref(n, chave(n, r)), r); return r; },
  async apagar(n, i){ await deleteDoc(ref(n, i)); }
};

const id = () => crypto.randomUUID();
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const hoje = () => iso(new Date());
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dataBR = d => d ? d.split('-').reverse().join('/') : '—';
const moeda = c => (c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const idade = nasc => {
  if(!nasc) return null;
  const n = new Date(nasc + 'T12:00:00'), h2 = new Date();
  let a = h2.getFullYear() - n.getFullYear();
  if(h2.getMonth() < n.getMonth() || (h2.getMonth() === n.getMonth() && h2.getDate() < n.getDate())) a--;
  return a >= 0 && a < 130 ? a : null;
};
const zap = w => {
  const d = String(w || '').replace(/\D/g, '');
  if(!d) return null;
  return 'https://wa.me/' + (d.length <= 11 ? '55' + d : d);
};
/* 'hoje', 'amanhã' ou a data — pro texto do lembrete soar natural */
const quandoBR = ds => {
  if(ds === hoje()) return 'hoje';
  const a = new Date(); a.setDate(a.getDate() + 1);
  if(ds === iso(a)) return 'amanhã';
  return 'dia ' + dataBR(ds).slice(0,5);
};
const iniciais = n => n.trim().split(/\s+/).slice(0,2).map(p => p[0]).join('').toUpperCase();

/* A foto vira texto para caber no Firestore. Original de celular passa de 5 MB;
   comprimida fica em ~300 KB, dentro do limite de 1 MB por documento. */
function comprimir(arquivo, largura = 1400, q = 0.82){
  return new Promise(ok => {
    const img = new Image();
    img.onload = () => {
      const e = Math.min(1, largura / img.width);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * e);
      c.height = Math.round(img.height * e);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      ok(c.toDataURL('image/jpeg', q));
    };
    img.src = URL.createObjectURL(arquivo);
  });
}

/* Duas versões: a miniatura fica junto do atendimento e é o que a linha do tempo
   mostra; a grande só é baixada quando você clica pra ampliar. */
async function duasVias(arquivo){
  let img = await comprimir(arquivo, 1400);
  if(img.length > 900000) img = await comprimir(arquivo, 1000, 0.7);  // teto de 1 MB do Firestore
  return { img, thumb: await comprimir(arquivo, 240, 0.7) };
}

/* ---------- início ---------- */
async function telaInicio(){
  const [pacs, ret, at, atsTodos] = await Promise.all([DB.todos('pacientes'), DB.todos('retornos'), DB.por('atendimentos','data',hoje()), DB.todos('atendimentos')]);
  const agendados = ret.filter(r => !r.concluido && r.data >= hoje()).length;
  const jaAtendidas = new Set(atsTodos.map(a => a.pacienteId));
  const pacDe = pid => pacs.find(x => x.id === pid);
  const nomeDe = pid => (pacDe(pid) || {}).nome || 'Paciente removida';

  /* próximos retornos: hoje em diante, os 5 primeiros */
  const proximos = ret.filter(r => !r.concluido && r.data >= hoje())
    .sort((a,b) => a.data.localeCompare(b.data) || (a.hora || '99').localeCompare(b.hora || '99'))
    .slice(0, 5);
  const lembreteInicio = r => {
    const p = pacDe(r.pacienteId);
    const w = p && zap(p.whatsapp || p.telefone);
    if(!w) return '';
    const txt = `Oi ${p.nome.split(' ')[0]}! Lembrando seu retorno ${quandoBR(r.data)}${r.hora ? ' às ' + r.hora : ''} 😊`;
    return `<a class="btn claro" href="${w}?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener" style="padding:7px 14px;font-size:13px;flex:none" onclick="event.stopPropagation()">Lembrar</a>`;
  };
  const data = new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});

  const md = hoje().slice(5);   // 'MM-DD' de hoje
  const aniversariantes = pacs.filter(p => p.nascimento && p.nascimento.slice(5) === md);

  tela.innerHTML = `
    <div class="cabecalho"><div><h1>Início</h1><p class="sub">${data}</p></div></div>
    ${aniversariantes.length ? `<div class="cartao" style="padding:16px 18px;margin-bottom:18px;border-color:var(--verde)">
      <div class="etiqueta" style="color:var(--verde)">🎂 Aniversariante${aniversariantes.length > 1 ? 's' : ''} de hoje</div>
      <div class="lista" style="margin-top:6px">
        ${aniversariantes.map(p => {
          const a = idade(p.nascimento);
          const w = zap(p.whatsapp || p.telefone);
          return `<div class="linha" data-pid="${p.id}">
            <div class="ret">${esc(iniciais(p.nome))}</div>
            <div style="flex:1"><b>${esc(p.nome)}</b><br><small>${a === null ? '' : `Fazendo ${a} anos hoje`}</small></div>
            ${w ? `<a class="btn claro" href="${w}?text=${encodeURIComponent('Feliz aniversário, ' + p.nome.split(' ')[0] + '! 🎉')}" target="_blank" rel="noopener" style="padding:7px 14px;font-size:13px" onclick="event.stopPropagation()">Parabenizar</a>` : ''}
          </div>`;
        }).join('')}
      </div></div>` : ''}
    <div class="grade3">
      ${[['Pacientes',pacs.length],['Retornos agendados',agendados],['Atendimentos hoje',at.length]]
        .map(([r,v]) => `<div class="cartao" style="padding:24px 22px"><div class="etiqueta">${r}</div><div class="num">${v}</div></div>`).join('')}
    </div>
    <div class="etiqueta" style="margin:28px 0 10px">Próximos retornos</div>
    ${!proximos.length
      ? `<p class="sub" style="padding:2px 2px 8px">Nenhum retorno marcado. Os retornos são marcados na ficha da paciente, em Histórico.</p>`
      : `<div class="lista">${proximos.map(r => `
        <div class="linha" data-pid="${r.pacienteId}">
          <div class="ret" style="font-size:11px;flex-direction:column;line-height:1.2">${quandoBR(r.data) === 'hoje' ? 'hoje' : dataBR(r.data).slice(0,5)}${r.hora ? `<span style="font-size:10px;color:var(--cinza)">${r.hora}</span>` : ''}</div>
          <div style="flex:1"><b>${esc(nomeDe(r.pacienteId))}</b>${jaAtendidas.has(r.pacienteId) ? '' : '<span class="selo">1ª consulta</span>'}<br><small>${r.obs ? esc(r.obs) : 'Retorno'}</small></div>
          ${lembreteInicio(r)}
        </div>`).join('')}</div>`}`;
  tela.querySelectorAll('[data-pid]').forEach(l => l.onclick = () => location.hash = '#/paciente/' + l.dataset.pid);
}

/* ---------- pacientes ---------- */
async function telaPacientes(){
  const [lista, ats] = await Promise.all([DB.todos('pacientes'), DB.todos('atendimentos')]);
  const jaAtendidas = new Set(ats.map(a => a.pacienteId));
  const todas = lista.sort((a,b) => a.nome.localeCompare(b.nome,'pt-BR'));

  tela.innerHTML = `
    <div class="cabecalho"><h1>Pacientes</h1>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn claro" id="recAvulso">Receituário avulso</button>
        <button class="btn" id="nova">${ICO.mais}Nova paciente</button>
      </div></div>
    <div class="busca">${ICO.busca}<input id="q" type="search" placeholder="Buscar pelo nome" autocomplete="off"></div>
    <div id="resultado"></div>`;

  const alvo = document.getElementById('resultado');
  const pintar = termo => {
    const t = termo.trim().toLowerCase();
    const vis = t ? todas.filter(p => p.nome.toLowerCase().includes(t)) : todas;

    if(!todas.length){
      alvo.innerHTML = `<div class="vazio"><h2>Nenhuma paciente ainda</h2><p>Cadastre a primeira para começar.</p></div>`;
      return;
    }
    if(!vis.length){
      alvo.innerHTML = `<div class="vazio"><h2>Nada encontrado</h2><p>Nenhum nome contém “${esc(termo)}”.</p></div>`;
      return;
    }
    alvo.innerHTML = `<div class="lista">${vis.map(p => `
      <div class="linha" data-id="${p.id}">
        ${p.foto ? `<img class="ret" src="${p.foto}" alt="">` : `<div class="ret">${esc(iniciais(p.nome))}</div>`}
        <div><b>${esc(p.nome)}</b>${jaAtendidas.has(p.id) ? '' : '<span class="selo">1ª consulta</span>'}<br><small>${p.telefone ? esc(p.telefone) : 'Sem telefone'}</small></div>
      </div>`).join('')}</div>`;
    alvo.querySelectorAll('.linha').forEach(l => l.onclick = () => location.hash = `#/paciente/${l.dataset.id}`);
  };

  pintar('');
  document.getElementById('q').oninput = e => pintar(e.target.value);
  document.getElementById('nova').onclick = () => formPaciente();
  document.getElementById('recAvulso').onclick = () => formReceituarioAvulso();

  /* receituários emitidos para quem não é paciente ficam listados à parte */
  const avulsos = (await DB.todos('receituarios')).filter(x => x.avulso)
    .sort((a,b) => b.data.localeCompare(a.data)).slice(0, 12);
  if(avulsos.length){
    const cx = document.createElement('div');
    cx.innerHTML = `<div class="etiqueta" style="margin:32px 0 10px">Receituários avulsos</div>
      <div class="lista">${avulsos.map(x => `<div class="linha" data-av="${x.id}">
        <div class="ret" style="font-size:11px">${dataBR(x.data).slice(0,5)}</div>
        <div style="flex:1"><b>${esc(x.nomeAvulso || 'Sem nome')}</b><br>
          <small>${x.itens.length} ${x.itens.length > 1 ? 'itens' : 'item'}${x.itens[0] ? ' · ' + esc(x.itens[0].produto) : ''}</small></div>
        <button class="btn claro" data-avp="${x.id}" style="padding:7px 14px;font-size:13px;flex:none">Imprimir</button>
      </div>`).join('')}</div>`;
    tela.append(cx);
    cx.querySelectorAll('[data-avp]').forEach(b => b.onclick = async e => {
      e.stopPropagation();
      const x = await DB.ler('receituarios', b.dataset.avp);
      if(x) imprimirReceituario(x, {nome: x.nomeAvulso || ''});
    });
    cx.querySelectorAll('[data-av]').forEach(l => l.onclick = async () => {
      const x = await DB.ler('receituarios', l.dataset.av);
      if(x) formReceituario({id:'', nome:x.nomeAvulso || '', avulso:true}, x);
    });
  }
}

function formPaciente(p){
  const novo = !p;
  p = p || {id:id(), nome:'', cpf:'', nascimento:'', telefone:'', whatsapp:'', email:'', profissao:'', obs:'', foto:null, criadoEm:Date.now()};
  let foto = p.foto;

  abrirModal(`
    <div class="topo"><h2>${novo ? 'Nova paciente' : 'Editar dados'}</h2></div>
    <div class="perfil">
      <div id="previa">${foto ? `<img class="ret" src="${foto}" alt="">` : `<div class="ret">—</div>`}</div>
      <button class="btn claro" id="escolher">Escolher foto</button>
      <input type="file" id="arquivo" accept="image/*" hidden>
    </div>
    <label class="campo"><span>Nome</span><input id="nome" value="${esc(p.nome)}" required></label>
    <div class="dupla">
      <label class="campo"><span>CPF</span><input id="cpf" inputmode="numeric" value="${esc(p.cpf)}"></label>
      <label class="campo"><span>Data de nascimento <b id="idadeAviso" style="font-weight:600;color:var(--verde)"></b></span><input id="nascimento" type="date" value="${esc(p.nascimento)}"></label>
      <label class="campo"><span>Telefone</span><input id="telefone" inputmode="tel" value="${esc(p.telefone)}"></label>
      <label class="campo"><span>WhatsApp</span><input id="whatsapp" inputmode="tel" value="${esc(p.whatsapp)}"></label>
      <label class="campo"><span>Profissão</span><input id="profissao" value="${esc(p.profissao || '')}"></label>
    </div>
    <label class="campo"><span>E-mail</span><input id="email" type="email" value="${esc(p.email)}"></label>
    <label class="campo"><span>Observações</span><textarea id="obs">${esc(p.obs)}</textarea></label>
    <div class="acoes">
      <button class="btn texto" id="cancelar">Cancelar</button>
      <button class="btn" id="salvar">Salvar</button>
    </div>`);

  const nascCampo = modalCorpo.querySelector('#nascimento');
  const idadeAviso = modalCorpo.querySelector('#idadeAviso');
  const mostrarIdade = () => {
    const a = idade(nascCampo.value);
    idadeAviso.textContent = a === null ? '' : `· ${a} anos`;
  };
  nascCampo.oninput = mostrarIdade; mostrarIdade();

  const arquivo = modalCorpo.querySelector('#arquivo');
  modalCorpo.querySelector('#escolher').onclick = () => arquivo.click();
  arquivo.onchange = async () => {
    if(!arquivo.files[0]) return;
    foto = await comprimir(arquivo.files[0], 200, 0.75);
    modalCorpo.querySelector('#previa').innerHTML = `<img class="ret" src="${foto}" alt="">`;
  };
  modalCorpo.querySelector('#cancelar').onclick = fecharModal;
  modalCorpo.querySelector('#salvar').onclick = async () => {
    const nome = modalCorpo.querySelector('#nome').value.trim();
    if(!nome){ aviso('O nome é obrigatório.'); return; }
    const reg = {...p, nome, foto,
      cpf: modalCorpo.querySelector('#cpf').value.trim(),
      nascimento: modalCorpo.querySelector('#nascimento').value,
      telefone: modalCorpo.querySelector('#telefone').value.trim(),
      whatsapp: modalCorpo.querySelector('#whatsapp').value.trim(),
      email: modalCorpo.querySelector('#email').value.trim(),
      profissao: modalCorpo.querySelector('#profissao').value.trim(),
      obs: modalCorpo.querySelector('#obs').value.trim()};
    await DB.gravar('pacientes', reg);
    fecharModal();
    aviso(novo ? 'Paciente cadastrada.' : 'Dados salvos.');
    rotear();
  };
  setTimeout(() => modalCorpo.querySelector('#nome').focus(), 60);
}

/* ---------- ficha ---------- */
let abaAtual = 'dados';

async function telaFicha(pid){
  const [p, atsP] = await Promise.all([DB.ler('pacientes', pid), DB.por('atendimentos','pacienteId',pid)]);
  if(!p){ tela.innerHTML = `<div class="vazio"><h2>Paciente não encontrada</h2><p>Este registro não existe.</p></div>`; return; }

  tela.innerHTML = `
    <a href="#/pacientes" class="btn texto" style="margin-bottom:18px;padding-left:0">${ICO.volta}Pacientes</a>
    <div class="perfil">
      ${p.foto ? `<img class="ret" src="${p.foto}" alt="">` : `<div class="ret">${esc(iniciais(p.nome))}</div>`}
      <div style="flex:1;min-width:0"><h1 style="font-size:30px">${esc(p.nome)}${atsP.length ? '' : '<span class="selo">1ª consulta</span>'}</h1>
        <p class="sub">${p.telefone ? esc(p.telefone) : 'Sem telefone'}</p></div>
      <button class="btn" id="atNovo" style="flex:none">${ICO.mais}<span class="soLargo">Novo atendimento</span></button>
    </div>
    <div class="abas">
      <button data-a="dados">Dados</button>
      <button data-a="anamnese">Anamnese</button>
      <button data-a="fotos">Fotos</button>
      <button data-a="historico">Histórico</button>
    </div>
    <div id="conteudo"></div>`;

  tela.querySelector('#atNovo').onclick = () => formAtendimento(p);
  const pintarAbas = () => tela.querySelectorAll('.abas button').forEach(b => b.classList.toggle('ativo', b.dataset.a === abaAtual));
  tela.querySelectorAll('.abas button').forEach(b => b.onclick = () => { abaAtual = b.dataset.a; pintarAbas(); montar(); });

  const montar = () => {
    const alvo = document.getElementById('conteudo');
    if(abaAtual === 'dados') return abaDados(alvo, p);
    if(abaAtual === 'anamnese') return abaAnamnese(alvo, p);
    if(abaAtual === 'fotos') return abaFotos(alvo, p);
    return abaHistorico(alvo, p);
  };
  pintarAbas(); montar();
}

function abaDados(alvo, p){
  const a = idade(p.nascimento);
  const linhas = [['CPF',p.cpf],['Nascimento', p.nascimento ? dataBR(p.nascimento) + (a === null ? '' : ` · ${a} anos`) : ''],
    ['Telefone',p.telefone],['WhatsApp',p.whatsapp],['E-mail',p.email],['Profissão',p.profissao],['Observações',p.obs]];
  alvo.innerHTML = `
    <div class="cartao" style="padding:8px 22px 18px">
      ${linhas.map(([r,v]) => `<div style="display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--linha)">
        <span class="etiqueta" style="flex:none">${r}</span>
        <span style="text-align:right;font-size:14px;white-space:pre-wrap">${v ? esc(v) : '<span style="color:var(--linha2)">—</span>'}</span></div>`).join('')}
    </div>
    <div class="acoes" style="border:0">
      <button class="btn texto perigo" id="excluir">Excluir paciente</button>
      <button class="btn claro" id="editar">Editar dados</button>
    </div>`;
  alvo.querySelector('#editar').onclick = () => formPaciente(p);
  alvo.querySelector('#excluir').onclick = async () => {
    if(!await confirmar(`Excluir ${p.nome} e todo o histórico dela? Não tem como desfazer.`)) return;
    for(const a of await DB.por('atendimentos','pacienteId',p.id)) await DB.apagar('atendimentos', a.id);
    for(const f of await DB.por('fotos','pacienteId',p.id)) await DB.apagar('fotos', f.id);
    for(const r of await DB.por('retornos','pacienteId',p.id)) await DB.apagar('retornos', r.id);
    for(const t2 of await DB.por('termos','pacienteId',p.id)) await DB.apagar('termos', t2.id);
    for(const f2 of await DB.por('fichas','pacienteId',p.id)) await DB.apagar('fichas', f2.id);
    for(const r2 of await DB.por('receituarios','pacienteId',p.id)) await DB.apagar('receituarios', r2.id);
    await DB.apagar('anamneses', p.id);
    await DB.apagar('pacientes', p.id);
    aviso('Paciente excluída.');
    location.hash = '#/pacientes';
  };
}

async function abaHistorico(alvo, p){
  const [ats, rets, ans, termos] = await Promise.all([DB.por('atendimentos','pacienteId',p.id), DB.por('retornos','pacienteId',p.id), DB.por('anotacoes','pacienteId',p.id), DB.por('termos','pacienteId',p.id)]);
  const receituarios = await DB.por('receituarios','pacienteId',p.id);
  const anotadas = new Set(ans.filter(a => a.imagem).map(a => a.id));

  const eventos = [
    ...ats.map(a => ({tipo:'atendimento', data:a.data, dado:a})),
    ...rets.map(r => ({tipo:'retorno', data:r.data, dado:r})),
    ...termos.map(t => ({tipo:'termo', data:t.data, dado:t})),
    ...receituarios.map(x => ({tipo:'receituario', data:x.data, dado:x}))
  ].sort((x,y) => y.data.localeCompare(x.data));

  alvo.innerHTML = `
    <div style="display:flex;gap:8px;margin-bottom:26px;flex-wrap:wrap">
      <button class="btn claro" id="novoRet">Marcar retorno</button>
      <button class="btn claro" id="novoTermo">Termo</button>
      <button class="btn claro" id="novoRec">Receituário</button>
    </div>
    <div id="tempo"></div>`;

  alvo.querySelector('#novoRet').onclick = () => formRetorno(p);
  alvo.querySelector('#novoTermo').onclick = () => formTermo(p);
  alvo.querySelector('#novoRec').onclick = () => formReceituario(p, null);

  const t = alvo.querySelector('#tempo');
  if(!eventos.length){
    t.innerHTML = `<div class="vazio"><h2>Sem histórico ainda</h2><p>Registre o primeiro atendimento desta paciente.</p></div>`;
    return;
  }

  t.className = 'tempo';
  t.innerHTML = eventos.map(e => {
    if(e.tipo === 'retorno'){
      const futuro = e.data >= hoje() && !e.dado.concluido;
      return `<div class="evento ${futuro ? 'futuro' : ''}">
        <div class="data">${dataBR(e.data)}</div>
        <h3>Retorno${e.dado.hora ? ' · ' + e.dado.hora : ''}${e.dado.concluido ? ' · concluído' : futuro ? ' · marcado' : ''}</h3>
        ${e.dado.obs ? `<div class="obs">${esc(e.dado.obs)}</div>` : ''}
        <div style="margin-top:8px;display:flex;gap:4px">
          ${!e.dado.concluido ? `<button class="btn texto" data-ok="${e.dado.id}">Marcar como feito</button>` : ''}
          <button class="btn texto perigo" data-delr="${e.dado.id}">Excluir</button>
        </div></div>`;
    }
    if(e.tipo === 'receituario'){
      const rc = e.dado;
      return `<div class="evento">
        <div class="data">${dataBR(e.data)}</div>
        <h3>Receituário</h3>
        <div class="meta">${rc.itens.length} ${rc.itens.length > 1 ? 'itens' : 'item'}${rc.itens[0] ? ' · ' + esc(rc.itens[0].produto) : ''}</div>
        <div style="margin-top:8px;display:flex;gap:4px">
          <button class="btn texto" data-vrec="${rc.id}">Ver e editar</button>
          <button class="btn texto" data-prec="${rc.id}">Imprimir</button>
        </div></div>`;
    }
    if(e.tipo === 'termo'){
      const t2 = e.dado;
      return `<div class="evento">
        <div class="data">${dataBR(e.data)}</div>
        <h3>Termo assinado</h3>
        <div class="meta">${esc(t2.titulo)}</div>
        <div style="margin-top:8px;display:flex;gap:4px">
          <button class="btn texto" data-vt="${t2.id}">Ver termo</button>
          <button class="btn texto perigo" data-delt="${t2.id}">Excluir</button>
        </div></div>`;
    }
    const a = e.dado;
    const minhas = (a.fotos || []).slice().sort((x,y) => x.momento.localeCompare(y.momento));
    return `<div class="evento">
      <div class="data">${dataBR(a.data)}</div>
      <h3>${esc(a.procedimento)}</h3>
      <div class="meta">${[a.produto && esc(a.produto), a.quantidade && esc(a.quantidade), a.valorCentavos ? moeda(a.valorCentavos) : ''].filter(Boolean).join(' · ') || '—'}</div>
      ${a.obs ? `<div class="obs" style="margin-top:8px">${esc(a.obs)}</div>` : ''}
      ${minhas.length ? `<div class="miniaturas">${minhas.map(f => `
        <figure><img src="${f.thumb}" alt="${f.momento}" data-zoom="${f.id}">
        <figcaption>${f.momento}${anotadas.has(f.id) ? ' ·<b style="color:var(--verde)"> anotada</b>' : ''}</figcaption></figure>`).join('')}</div>` : ''}
      <div style="margin-top:10px"><button class="btn texto perigo" data-dela="${a.id}">Excluir</button></div>
    </div>`;
  }).join('');

  t.querySelectorAll('[data-zoom]').forEach(i => i.onclick = () => abrirFoto(i.dataset.zoom, i.src, () => telaFicha(p.id)));
  t.querySelectorAll('[data-ok]').forEach(b => b.onclick = async () => {
    const r = await DB.ler('retornos', b.dataset.ok);
    await DB.gravar('retornos', {...r, concluido:true});
    aviso('Retorno concluído.'); abaHistorico(alvo, p);
  });
  t.querySelectorAll('[data-vt]').forEach(b => b.onclick = () => verTermo(b.dataset.vt, p));
  t.querySelectorAll('[data-vrec]').forEach(b => b.onclick = () => verReceituario(b.dataset.vrec, p));
  t.querySelectorAll('[data-prec]').forEach(b => b.onclick = async () => {
    const rc = await DB.ler('receituarios', b.dataset.vrec || b.dataset.prec);
    if(rc) imprimirReceituario(rc, p);
  });
  t.querySelectorAll('[data-delt]').forEach(b => b.onclick = async () => {
    if(!await confirmar('Excluir este termo assinado? Ele é um documento da paciente.')) return;
    await DB.apagar('termos', b.dataset.delt);
    aviso('Termo excluído.'); abaHistorico(alvo, p);
  });
  t.querySelectorAll('[data-delr]').forEach(b => b.onclick = async () => {
    if(!await confirmar('Excluir este retorno?')) return;
    await DB.apagar('retornos', b.dataset.delr);
    aviso('Retorno excluído.'); abaHistorico(alvo, p);
  });
  t.querySelectorAll('[data-dela]').forEach(b => b.onclick = async () => {
    if(!await confirmar('Excluir este atendimento e as fotos dele?')) return;
    for(const f of await DB.por('fotos','atendimentoId',b.dataset.dela)){
      await DB.apagar('anotacoes', f.id).catch(() => {});
      await DB.apagar('fotos', f.id);
    }
    await DB.apagar('atendimentos', b.dataset.dela);
    aviso('Atendimento excluído.'); abaHistorico(alvo, p);
  });
}

/* Visualização da foto: alterna Original/Anotada e abre o editor. */
async function abrirFoto(fid, previa, depois){
  const acoes = document.getElementById('lupaAcoes');
  const imgEl = document.getElementById('lupaImg');
  imgEl.src = previa; acoes.innerHTML = ''; lupa.showModal();

  const [f, an] = await Promise.all([DB.ler('fotos', fid), DB.ler('anotacoes', fid)]);
  if(!f) return;
  const temAnotacao = an && an.imagem;
  let mostrando = temAnotacao ? 'anotada' : 'original';
  const pintar = () => {
    imgEl.src = mostrando === 'anotada' ? an.imagem : f.img;
    acoes.innerHTML = `
      ${temAnotacao ? `<div class="alternar">
        <button data-v="original" class="${mostrando === 'original' ? 'ativo' : ''}">Original</button>
        <button data-v="anotada" class="${mostrando === 'anotada' ? 'ativo' : ''}">Anotada</button>
      </div>` : ''}
      <button class="btn claro" id="lupaEditar">Editar</button>`;
    acoes.querySelectorAll('[data-v]').forEach(b => b.onclick = e => { e.stopPropagation(); mostrando = b.dataset.v; pintar(); });
    acoes.querySelector('#lupaEditar').onclick = e => {
      e.stopPropagation();
      lupa.close();
      Editor.abrir(f.img, fid, f.pacienteId, an ? an.tracos : [], depois);
    };
  };
  pintar();
}

/* ---------- aba Fotos: o rosto por ângulos + modo apresentação ---------- */
async function abaFotos(alvo, p){
  const [fotos, ans, ats] = await Promise.all([
    DB.por('fotos','pacienteId',p.id), DB.por('anotacoes','pacienteId',p.id), DB.por('atendimentos','pacienteId',p.id)
  ]);
  const anot = new Map(ans.filter(a => a.imagem).map(a => [a.id, a]));
  const dataDe = new Map(ats.map(a => [a.id, a.data]));
  const thumbDe = new Map();
  ats.forEach(a => (a.fotos || []).forEach(x => thumbDe.set(x.id, x.thumb)));
  fotos.forEach(f => {
    f.data = f.data || dataDe.get(f.atendimentoId) || '';
    f.thumb = f.thumb || thumbDe.get(f.id) || f.img;
  });
  fotos.sort((a,b) => (b.data || '').localeCompare(a.data || '') || b.criadoEm - a.criadoEm);

  const botao = `<div style="margin-bottom:22px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <button class="btn" id="addFotos">${ICO.mais}Adicionar fotos</button>
    ${fotos.length >= 2 ? `<button class="btn claro" id="cmpBtn">Comparar</button><span class="sub" id="cmpDica"></span>` : ''}
  </div>`;
  let selecao = null;
  if(!fotos.length){
    alvo.innerHTML = botao + `<div class="vazio"><h2>Sem fotos ainda</h2><p>Tire as fotos da avaliação aqui, ou registre um atendimento com fotos.</p></div>`;
    alvo.querySelector('#addFotos').onclick = () => formFotosAvulsas(p);
    return;
  }

  const grupos = [...ANGULOS, ''];
  const rotulo = a => a || 'Sem ângulo';

  /* ordem de apresentação: percorre os ângulos na sequência do protocolo,
     pegando a foto mais recente de cada; depois as demais */
  const sequencia = [];
  grupos.forEach(a => fotos.filter(f => (f.angulo || '') === a).forEach(f => sequencia.push(f)));

  alvo.innerHTML = botao + grupos.map(a => {
    const doGrupo = fotos.filter(f => (f.angulo || '') === a);
    if(!doGrupo.length) return '';
    return `<div class="etiqueta" style="margin:4px 0 10px">${rotulo(a)}</div>
      <div class="miniaturas" style="margin:0 0 22px">
        ${doGrupo.map(f => `<figure>
          <img src="${f.thumb}" data-apre="${f.id}" alt="">
          <figcaption>${f.data ? dataBR(f.data).slice(0,5) : ''} · ${f.momento}${anot.has(f.id) ? ' ·<b style="color:var(--verde)"> anotada</b>' : ''}</figcaption>
        </figure>`).join('')}
      </div>`;
  }).join('') + `<p class="sub">Toque numa foto e deslize para o lado para percorrer os ângulos com a paciente.</p>`;

  alvo.querySelector('#addFotos').onclick = () => formFotosAvulsas(p);

  const dica = alvo.querySelector('#cmpDica');
  const cmpBtn = alvo.querySelector('#cmpBtn');
  if(cmpBtn) cmpBtn.onclick = () => {
    if(selecao){ selecao = null; cmpBtn.textContent = 'Comparar'; dica.textContent = '';
      alvo.querySelectorAll('[data-apre]').forEach(i => i.classList.remove('selFoto')); return; }
    selecao = [];
    cmpBtn.textContent = 'Cancelar';
    dica.textContent = 'Toque na foto de ANTES';
  };

  alvo.querySelectorAll('[data-apre]').forEach(img => img.onclick = async () => {
    if(selecao){
      if(selecao.includes(img.dataset.apre)) return;
      selecao.push(img.dataset.apre);
      img.classList.add('selFoto');
      if(selecao.length === 1){ dica.textContent = 'Agora toque na foto de DEPOIS'; return; }
      dica.textContent = 'Abrindo…';
      const [fa, fb] = await Promise.all([DB.ler('fotos', selecao[0]), DB.ler('fotos', selecao[1])]);
      selecao = null; cmpBtn.textContent = 'Comparar'; dica.textContent = '';
      alvo.querySelectorAll('[data-apre]').forEach(i => i.classList.remove('selFoto'));
      Comparador.abrir(fa.img, fb.img);
      return;
    }
    const i = sequencia.findIndex(f => f.id === img.dataset.apre);
    apresentar(sequencia, i, p);
  });
}

      </select></figure>`).join('');
    modalCorpo.querySelectorAll('[data-fang]').forEach(s => s.onchange = () => { novas[+s.dataset.fang].angulo = s.value; });

  };

  modalCorpo.querySelector('#fcanc').onclick = fecharModal;
  modalCorpo.querySelector('#fsalvar').onclick = async () => {
    if(!novas.length){ aviso('Adicione ao menos uma foto.'); return; }
    const data = modalCorpo.querySelector('#fdata').value || hoje();
    for(const v of novas)
      await DB.gravar('fotos', {id:id(), atendimentoId:'', pacienteId:p.id, momento:'avaliação',
        angulo:v.angulo || '', data, img:v.img, thumb:v.thumb, criadoEm:Date.now()});
    fecharModal();
    aviso(novas.length === 1 ? 'Foto salva.' : `${novas.length} fotos salvas.`);
    abaAtual = 'fotos'; telaFicha(p.id);
  };
}

/* Modo apresentação: uma foto por vez, deslizar troca de ângulo. */
async function apresentar(seq, indice, p){
  const acoes = document.getElementById('lupaAcoes');
  const imgEl = document.getElementById('lupaImg');
  lupa.showModal();

  let i = indice, mostrando = 'auto', x0 = null, versao = 0;

  async function pintar(){
    const minha = ++versao;
    const f0 = seq[i];
    if(f0.thumb) imgEl.src = f0.thumb;
    const [f, an] = await Promise.all([DB.ler('fotos', f0.id), DB.ler('anotacoes', f0.id)]);
    if(minha !== versao) return;   // o usuário já avançou; esta resposta ficou velha
    const tem = an && an.imagem;
    const vendoAnotada = tem && mostrando !== 'original';
    imgEl.src = vendoAnotada ? an.imagem : f.img;

    acoes.innerHTML = `
      <button class="btn texto" id="apAnt" ${i === 0 ? 'disabled' : ''}>${ICO.esq}</button>
      <span class="etiqueta" style="align-self:center;min-width:110px;text-align:center">${esc(f0.angulo || 'Sem ângulo')} · ${i+1}/${seq.length}</span>
      <button class="btn texto" id="apProx" ${i === seq.length-1 ? 'disabled' : ''}>${ICO.dir}</button>
      ${tem ? `<div class="alternar">
        <button data-v="original" class="${!vendoAnotada ? 'ativo' : ''}">Original</button>
        <button data-v="anotada" class="${vendoAnotada ? 'ativo' : ''}">Anotada</button>
      </div>` : ''}
      <button class="btn claro" id="apEditar">Editar</button>`;

    acoes.querySelector('#apAnt').onclick = e => { e.stopPropagation(); if(i > 0){ i--; mostrando = 'auto'; pintar(); } };
    acoes.querySelector('#apProx').onclick = e => { e.stopPropagation(); if(i < seq.length-1){ i++; mostrando = 'auto'; pintar(); } };
    acoes.querySelectorAll('[data-v]').forEach(b => b.onclick = e => { e.stopPropagation(); mostrando = b.dataset.v; pintar(); });
    acoes.querySelector('#apEditar').onclick = e => {
      e.stopPropagation(); lupa.close();
      Editor.abrir(f.img, f0.id, f.pacienteId, an ? an.tracos : [], () => { abaAtual = 'fotos'; telaFicha(p.id); });
    };
  }

  imgEl.onpointerdown = e => { x0 = e.clientX; };
  imgEl.onpointerup = e => {
    if(x0 === null) return;
    const dx = e.clientX - x0; x0 = null;
    if(Math.abs(dx) < 40) return;               // toque parado fecha (comportamento da lupa)
    if(dx < 0 && i < seq.length-1){ i++; mostrando = 'auto'; pintar(); }
    if(dx > 0 && i > 0){ i--; mostrando = 'auto'; pintar(); }
  };

  pintar();
}

/* Monta e gerencia uma ficha por procedimento. Respostas salvam sozinhas. */
async function abrirFichaProc(p, fichaDoc){
  const esq = FICHAS[fichaDoc.tipo];
  const f = fichaDoc;
  f.respostas = f.respostas || {};

  const campoHTML = c => {
    const v = f.respostas[c.k];
    if(c.tipo === 'tx') return `<label class="campo"><span>${c.r}</span><input data-fk="${c.k}" value="${esc(v || '')}"></label>`;
    if(c.tipo === 'ta') return `<label class="campo"><span>${c.r}</span><textarea data-fk="${c.k}">${esc(v || '')}</textarea></label>`;
    if(c.tipo === 'un') return `<div class="campo"><span>${c.r}</span>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:2px">
        ${c.ops.map(o => `<button type="button" class="btn ${v === o ? '' : 'claro'}" data-fk="${c.k}" data-op="${esc(o)}" style="padding:7px 13px;font-size:13px">${o}</button>`).join('')}
      </div></div>`;
    // ch: várias caixas
    const marc = new Set(v || []);
    return `<div class="campo"><span>${c.r}</span>
      ${c.ops.map(o => `<label class="marcar" style="margin:7px 0 0">
        <input type="checkbox" data-fk="${c.k}" data-op="${esc(o)}" ${marc.has(o) ? 'checked' : ''}>${o}</label>`).join('')}
    </div>`;
  };

  abrirModal(`
    <div class="topo"><h2>${esq.nome}</h2><span class="sub">${dataBR(f.data)}</span></div>
    <p class="sub" style="margin:-8px 0 16px">${esc(p.nome)}${p.nascimento ? ' · ' + (idade(p.nascimento) ?? '') + ' anos' : ''}${p.cpf ? ' · CPF ' + esc(p.cpf) : ''}</p>
    <div style="max-height:56vh;overflow:auto;padding-right:4px">
      ${esq.secoes.map((s, i) => `
        <div class="etiqueta" style="margin:${i ? '22px' : '2px'} 0 10px">${i+1}. ${s.t}${s.prof ? ' · preenchimento da profissional' : ''}</div>
        ${s.campos.map(campoHTML).join('')}`).join('')}
      <div class="etiqueta" style="margin:22px 0 10px">Declaração da paciente</div>
      <div style="border:1px solid var(--linha);border-radius:var(--r);padding:12px;font-size:13px;white-space:pre-wrap">${esc(esq.declaracao)}</div>
      ${f.assinatura ? `<div style="margin-top:10px;border:1px solid var(--linha);border-radius:var(--r);background:#fff;padding:6px">
        <img src="${f.assinatura}" style="display:block;width:100%;max-height:120px;object-fit:contain" alt="Assinatura">
      </div><p class="sub" style="margin-top:6px">Assinada em ${new Date(f.assinadoEm).toLocaleDateString('pt-BR')} às ${new Date(f.assinadoEm).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</p>` : ''}
    </div>
    <div class="acoes">
      <button class="btn texto perigo" id="fpDel" style="margin-right:auto">Excluir</button>
      <span class="sub" id="fpEstado" style="align-self:center"></span>
      ${f.assinatura ? '' : '<button class="btn claro" id="fpAssinar">Coletar assinatura</button>'}
      <button class="btn" id="fpFechar">Fechar</button>
    </div>`);

  let timer;
  const salvar = async () => {
    f.atualizadoEm = Date.now();
    await DB.gravar('fichas', f);
    const e2 = modalCorpo.querySelector('#fpEstado');
    if(e2) e2.textContent = 'Salvo às ' + new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  };
  const agendar = () => { clearTimeout(timer); timer = setTimeout(salvar, 600); };

  modalCorpo.querySelectorAll('input[data-fk]:not([type=checkbox]), textarea[data-fk]').forEach(c => {
    c.oninput = () => { f.respostas[c.dataset.fk] = c.value; agendar(); };
  });
  modalCorpo.querySelectorAll('input[type=checkbox][data-fk]').forEach(c => {
    c.onchange = () => {
      const s = new Set(f.respostas[c.dataset.fk] || []);
      c.checked ? s.add(c.dataset.op) : s.delete(c.dataset.op);
      f.respostas[c.dataset.fk] = [...s];
      salvar();
    };

  modalCorpo.querySelectorAll('button[data-fk]').forEach(b => {

/* ---------- comparador antes/depois ---------- */
const Comparador = (() => {
  const el = document.getElementById('comp');
  const palco = document.getElementById('cpPalco');
  let A = null, B = null, modo = 'sobre', pct = 50;

  function pintar(){
    document.getElementById('cpSobre').classList.toggle('ativo', modo === 'sobre');
    document.getElementById('cpLado').classList.toggle('ativo', modo === 'lado');
    if(modo === 'lado'){
      palco.className = 'compLado';
      palco.innerHTML = `
        <div><span class="compSelo" style="left:12px">Antes</span><img src="${A}" alt="Antes"></div>
        <div><span class="compSelo" style="left:12px">Depois</span><img src="${B}" alt="Depois"></div>`;
      return;
    }
    palco.className = 'compPalco';
    palco.innerHTML = `
      <img src="${B}" alt="Depois">
      <img id="cpAntes" src="${A}" alt="Antes" style="clip-path:inset(0 ${100-pct}% 0 0)">
      <span class="compSelo" style="left:12px">Antes</span>
      <span class="compSelo" style="right:12px">Depois</span>
      <div id="compDivisor" style="left:${pct}%"></div>`;
  }

  function arrastar(e){
    if(modo !== 'sobre') return;
    const r = palco.getBoundingClientRect();
    pct = Math.min(98, Math.max(2, (e.clientX - r.left) / r.width * 100));
    const antes = document.getElementById('cpAntes');
    const div = document.getElementById('compDivisor');
    if(antes) antes.style.clipPath = `inset(0 ${100-pct}% 0 0)`;
    if(div) div.style.left = pct + '%';
  }
  let arrastando = false;
  palco.addEventListener('pointerdown', e => { e.preventDefault(); palco.setPointerCapture(e.pointerId); arrastando = true; arrastar(e); });
  palco.addEventListener('pointermove', e => { if(arrastando) arrastar(e); });
  const fim = () => arrastando = false;
  palco.addEventListener('pointerup', fim);
  palco.addEventListener('pointercancel', fim);

  document.getElementById('cpFechar').onclick = () => el.classList.remove('aberto');
  document.getElementById('cpSobre').onclick = () => { modo = 'sobre'; pintar(); };
  document.getElementById('cpLado').onclick = () => { modo = 'lado'; pintar(); };
  document.getElementById('cpTrocar').onclick = () => { [A, B] = [B, A]; pintar(); };

  return {
    abrir(imgAntes, imgDepois){
      A = imgAntes; B = imgDepois; modo = 'sobre'; pct = 50;
      el.classList.add('aberto');
      pintar();
    }
  };
})();

/* Assinatura em tela: quadro branco, caneta/dedo/mouse, sem zoom. */
const Assinatura = (() => {
  const el = document.getElementById('assin');
  const pad = document.getElementById('asPad');
  const ctx = pad.getContext('2d');
  let tem = false, aoConcluir = null, ultimo = null;

  function preparar(){
    const r = pad.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    pad.width = Math.round(r.width * dpr);
    pad.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, r.width, r.height);
    ctx.strokeStyle = '#0c0c0b'; ctx.lineWidth = 2.2;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    tem = false;
  }

  const ponto = e => {
    const r = pad.getBoundingClientRect();
    return {x: e.clientX - r.left, y: e.clientY - r.top};
  };

  pad.addEventListener('pointerdown', e => {
    e.preventDefault(); pad.setPointerCapture(e.pointerId);
    ultimo = ponto(e);
  });
  pad.addEventListener('pointermove', e => {
    if(!ultimo) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    evs.forEach(ev => {
      const p2 = ponto(ev);
      ctx.beginPath(); ctx.moveTo(ultimo.x, ultimo.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
      ultimo = p2; tem = true;
    });
  });
  const soltar = () => { ultimo = null; };
  pad.addEventListener('pointerup', soltar);
  pad.addEventListener('pointercancel', soltar);

  document.getElementById('asLimpar').onclick = preparar;
  document.getElementById('asCancelar').onclick = () => { el.classList.remove('aberto'); aoConcluir && aoConcluir(null); };
  document.getElementById('asConcluir').onclick = () => {
    if(!tem){ aviso('A paciente ainda não assinou.'); return; }
    const img = pad.toDataURL('image/png');
    el.classList.remove('aberto');
    aoConcluir && aoConcluir(img);
  };

  return {
    abrir(nomePaciente){
      return new Promise(ok => {
        aoConcluir = ok;
        document.getElementById('asNome').textContent = nomePaciente;
        el.classList.add('aberto');
        requestAnimationFrame(preparar);
      });
    }
  };
})();

async function sha256hex(txt){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
}

/* ---------- agenda ---------- */
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
let mesRef = (() => { const d = new Date(); d.setDate(1); return d; })();
let diaSel = hoje();

async function telaAgenda(){
  const [rets, ats, pacs, comps] = await Promise.all([DB.todos('retornos'), DB.todos('atendimentos'), DB.todos('pacientes'), DB.todos('compromissos')]);
  const nome = pid => (pacs.find(p => p.id === pid) || {}).nome || 'Paciente removida';
  const jaAtendidas = new Set(ats.map(a => a.pacienteId));
  const lembrete = (pid, data, hora, atrasado) => {
    const p = pacs.find(x => x.id === pid);
    const w = p && zap(p.whatsapp || p.telefone);
    if(!w) return '';
    const nome1 = p.nome.split(' ')[0];
    const txt = atrasado
      ? `Oi ${nome1}! Seu retorno estava marcado para ${dataBR(data)} — vamos remarcar? 😊`
      : `Oi ${nome1}! Lembrando seu retorno ${quandoBR(data)}${hora ? ' às ' + hora : ''} 😊`;
    return `<a class="btn claro" href="${w}?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener"
      style="padding:7px 14px;font-size:13px;flex:none" onclick="event.stopPropagation()">Lembrar</a>`;
  };

  /* tudo que acontece num dia, junto e ordenado por hora */
  const porDia = {};
  const juntar = (d, e) => (porDia[d] = porDia[d] || []).push(e);
  rets.forEach(r => juntar(r.data, {tipo: r.concluido ? 'feito' : 'retorno', hora: r.hora || '',
    pid: r.pacienteId, titulo: 'Retorno' + (r.concluido ? ' · concluído' : ''), obs: r.obs, pendente: !r.concluido, dataR: r.data}));
  ats.forEach(a => juntar(a.data, {tipo: 'atendimento', hora: '', pid: a.pacienteId, titulo: a.procedimento, obs: a.obs}));
  const diasInteiros = new Set();
  comps.forEach(c => {
    const fim = c.dataFim || c.data;
    for(let d = new Date(c.data + 'T12:00:00'); iso(d) <= fim; d.setDate(d.getDate() + 1)){
      const ds = iso(d);
      juntar(ds, {tipo:'compromisso', hora: c.diaInteiro ? '' : (c.horaIni || ''), cid: c.id,
        titulo: c.titulo, obs: c.diaInteiro ? 'Dia inteiro' : [c.horaIni, c.horaFim].filter(Boolean).join(' – ')});
      if(c.diaInteiro) diasInteiros.add(ds);
    }
  });
  Object.values(porDia).forEach(l => l.sort((x, y) => (x.hora || '99').localeCompare(y.hora || '99')));

  const atrasados = rets.filter(r => !r.concluido && r.data < hoje()).sort((a, b) => a.data.localeCompare(b.data));

  tela.innerHTML = `
    <div class="cabecalho"><div><h1>Agenda</h1><p class="sub">Retornos e atendimentos</p></div></div>
    ${atrasados.length ? `<div class="cartao" style="padding:14px 18px;margin-bottom:18px;border-color:var(--verde)">
      <div class="etiqueta" style="color:var(--verde)">${atrasados.length} retorno${atrasados.length > 1 ? 's' : ''} atrasado${atrasados.length > 1 ? 's' : ''}</div>
      <div style="margin-top:8px;display:flex;flex-direction:column;gap:5px">
        ${atrasados.map(r => `<div style="display:flex;align-items:center;gap:8px">
          <button class="rot" style="background:none;border:0;cursor:pointer;text-align:left;font-size:13.5px;flex:1" data-ir="${r.pacienteId}">
            <b>${dataBR(r.data)}</b> ${esc(nome(r.pacienteId))}</button>
          ${lembrete(r.pacienteId, r.data, r.hora, true)}</div>`).join('')}
      </div></div>` : ''}
    <div>
      <div class="calTopo">
        <h2 id="mes"></h2>
        <nav>
          <button class="btn texto" id="novoComp" style="font-size:13px">${ICO.mais}Compromisso</button>
          <button class="btn texto" id="hj" style="font-size:13px">Hoje</button>
          <button class="seta" id="ant" aria-label="Mês anterior">${ICO.esq}</button>
          <button class="seta" id="prox" aria-label="Próximo mês">${ICO.dir}</button>
        </nav>
      </div>
      <div class="semana">${['dom','seg','ter','qua','qui','sex','sáb'].map(d => `<span>${d}</span>`).join('')}</div>
      <div class="dias" id="dias"></div>
    </div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:11.5px;color:var(--cinza)">
      ${[['retorno','Retorno marcado'],['feito','Retorno concluído'],['atendimento','Atendimento realizado'],['compromisso','Compromisso']]
        .map(([c, r]) => `<span style="display:flex;align-items:center;gap:6px"><span class="pt ${c}"></span>${r}</span>`).join('')}
    </div>
    <div id="doDia"></div>`;

  tela.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => { abaAtual = 'historico'; location.hash = `#/paciente/${b.dataset.ir}`; });
  tela.querySelector('#ant').onclick = () => { mesRef.setMonth(mesRef.getMonth() - 1); pintar(); };
  tela.querySelector('#prox').onclick = () => { mesRef.setMonth(mesRef.getMonth() + 1); pintar(); };
  tela.querySelector('#hj').onclick = () => { mesRef = new Date(); mesRef.setDate(1); diaSel = hoje(); pintar(); };
  tela.querySelector('#novoComp').onclick = () => formCompromisso(null, diaSel);

  function pintar(){
    const m = MESES[mesRef.getMonth()];
    tela.querySelector('#mes').textContent = `${m[0].toUpperCase()}${m.slice(1)} de ${mesRef.getFullYear()}`;

    const dow = new Date(mesRef.getFullYear(), mesRef.getMonth(), 1).getDay();
    const noMes = new Date(mesRef.getFullYear(), mesRef.getMonth() + 1, 0).getDate();
    const total = Math.ceil((dow + noMes) / 7) * 7;
    const inicio = new Date(mesRef.getFullYear(), mesRef.getMonth(), 1 - dow);

    let html = '';
    for(let i = 0; i < total; i++){
      const d = new Date(inicio.getFullYear(), inicio.getMonth(), inicio.getDate() + i);
      const ds = iso(d);
      const itens = porDia[ds] || [];
      const classes = ['dia'];
      if(d.getMonth() !== mesRef.getMonth()) classes.push('fora');
      if(ds === hoje()) classes.push('hoje');
      if(ds === diaSel) classes.push('sel');
      if(diasInteiros.has(ds)) classes.push('ocupado');
      html += `<button class="${classes.join(' ')}" data-d="${ds}">
        <div class="n">${d.getDate()}</div>
        <div class="pontos">${itens.slice(0, 4).map(i => `<span class="pt ${i.tipo}"></span>`).join('')}</div>
      </button>`;
    }
    tela.querySelector('#dias').innerHTML = html;
    tela.querySelectorAll('.dia').forEach(b => b.onclick = () => { diaSel = b.dataset.d; pintar(); });
    pintarDia();
  }

  function pintarDia(){
    const alvo = tela.querySelector('#doDia');

      ? `Dia ocupado — ${esc((doDiaComp[0] || {}).titulo || 'compromisso')}`
      : !itens.length ? 'Dia livre' : `${itens.length} marcação${itens.length > 1 ? 'ões' : ''} — o restante do dia está livre`;
    alvo.innerHTML = `<div class="etiqueta" style="margin:28px 0 10px">${dataBR(diaSel)} · <span style="color:var(--verde)">${resumo}</span></div>` + (

            ? `<div class="linha" data-c="${i.cid}">

              <div style="flex:1"><b>${esc(i.titulo)}</b><br><small>${esc(i.obs)}</small></div>
            </div>`
            : `<div class="linha" data-p="${i.pid}">
              <div class="ret" style="font-size:11px;letter-spacing:.05em">${i.hora || '—'}</div>
              <div style="flex:1"><b>${esc(nome(i.pid))}</b>${jaAtendidas.has(i.pid) ? '' : '<span class="selo">1ª consulta</span>'}<br><small>${esc(i.titulo)}${i.obs ? ' · ' + esc(i.obs) : ''}</small></div>
              ${i.pendente ? lembrete(i.pid, i.dataR, i.hora, i.dataR < hoje()) : ''}
            </div>`).join('')}</div>`);
    alvo.querySelectorAll('.linha[data-p]').forEach(l => l.onclick = () => { abaAtual = 'historico'; location.hash = `#/paciente/${l.dataset.p}`; });
    alvo.querySelectorAll('.linha[data-c]').forEach(l => l.onclick = async () => { const comp = await DB.ler('compromissos', l.dataset.c); if(comp && comp.laserId) return location.hash = '#/laser/' + comp.laserId; formCompromisso(comp, null); });
  }

  pintar();
}

/* compromisso: coisa que ocupa a agenda sem ser paciente — laser fora, congresso, pessoal */
function formCompromisso(c, dataSugerida){

      ${novo ? '' : '<button class="btn texto perigo" id="cdel" style="margin-right:auto">Excluir</button>'}

      <button class="btn" id="csalvar">Salvar</button>

  modalCorpo.querySelector('#cinteiro').onchange = e =>
    modalCorpo.querySelector('#chorasCx').style.display = e.target.checked ? 'none' : '';

    const titulo = modalCorpo.querySelector('#ctitulo').value.trim();

      horaIni: modalCorpo.querySelector('#chini').value,
      horaFim: modalCorpo.querySelector('#chfim').value});
    aviso('Compromisso salvo.'); fecharModal(); telaAgenda();
  };
}

/* ---------- laser (dias de atendimento fora, uma vez por mês em outra cidade) ---------- */ function resumoLaser(dia){ const pessoas = dia.pessoas || []; if(!pessoas.length) return 'Sem ninguém marcado ainda'; const atendidas = pessoas.filter(x => x.status === 'atendida').length; return `${pessoas.length} agendada${pessoas.length > 1 ? 's' : ''} · ${atendidas} atendida${atendidas !== 1 ? 's' : ''}`; } let abaLaser = 'dias';
async function telaLaser(){ const dias = await DB.todos('laser'); const proximos = dias.filter(d => d.data >= hoje()).sort((a,b) => a.data.localeCompare(b.data)); const anteriores = dias.filter(d => d.data < hoje()).sort((a,b) => b.data.localeCompare(a.data)); const linha = d => `<div class="linha" data-id="${d.id}"><div class="ret" style="font-size:11px">${dataBR(d.data).slice(0,5)}</div><div style="flex:1"><b>${esc(d.cidade)}</b><br><small>${esc(resumoLaser(d))}</small></div></div>`; tela.innerHTML = `<div class="cabecalho"><h1>Laser</h1><button class="btn" id="novoDiaLaser">${ICO.mais}Novo dia</button></div><div class="abas" style="margin-bottom:22px"><button data-abal="dias">Dias</button><button data-abal="pessoas">Pessoas</button></div><div id="corpoLaser"></div>`; const corpoL = tela.querySelector('#corpoLaser'); const htmlDias = `<div class="etiqueta" style="margin:0 0 10px">Próximos</div>${!proximos.length ? `<p class="sub" style="padding:2px 2px 18px">Nenhum dia agendado.</p>` : `<div class="lista" style="margin-bottom:22px">${proximos.map(linha).join('')}</div>`}<div class="etiqueta" style="margin:0 0 10px">Anteriores</div>${!anteriores.length ? `<p class="sub" style="padding:2px 2px 8px">Nenhum dia anterior.</p>` : `<div class="lista">${anteriores.map(linha).join('')}</div>`}`;
  tela.querySelector('#novoDiaLaser').onclick = () => formDiaLaser();
  const pintarAbaL = () => tela.querySelectorAll('[data-abal]').forEach(b => b.classList.toggle('ativo', b.dataset.abal === abaLaser));
  const montarL = () => {
    if(abaLaser === 'pessoas') return telaLaserPessoas(corpoL);
    corpoL.innerHTML = htmlDias;
    corpoL.querySelectorAll('[data-id]').forEach(l => l.onclick = () => location.hash = '#/laser/' + l.dataset.id);
  };
  tela.querySelectorAll('[data-abal]').forEach(b => b.onclick = () => { abaLaser = b.dataset.abal; pintarAbaL(); montarL(); });
  pintarAbaL(); montarL();
} function formDiaLaser(dia){ const novo = !dia; dia = dia || {id:id(), cidade:'', data:hoje(), local:'', obs:'', pessoas:[], criadoEm:Date.now()}; abrirModal(`<div class="topo"><h2>${novo ? 'Novo dia de laser' : 'Editar dia'}</h2></div><label class="campo"><span>Cidade</span><input id="lcidade" value="${esc(dia.cidade)}" placeholder="Ex.: Caxias do Sul"></label><div class="dupla"><label class="campo"><span>Data</span><input id="ldata" type="date" value="${esc(dia.data)}"></label><label class="campo"><span>Local <span style="font-weight:400;color:var(--cinza)">(opcional)</span></span><input id="llocal" value="${esc(dia.local)}"></label></div><label class="campo"><span>Observações</span><textarea id="lobs">${esc(dia.obs)}</textarea></label><div class="acoes">${novo ? '' : '<button class="btn texto perigo" id="ldel" style="margin-right:auto">Excluir</button>'}<button class="btn texto" id="lcanc">Cancelar</button><button class="btn" id="lsalvar">Salvar</button></div>`); modalCorpo.querySelector('#lcanc').onclick = fecharModal; const del = modalCorpo.querySelector('#ldel'); if(del) del.onclick = async () => { if(!await confirmar(`Excluir o dia de laser em ${dia.cidade} e todas as pessoas marcadas nele? Não tem como desfazer.`)) return; for(const c of await DB.por('compromissos','laserId',dia.id)) await DB.apagar('compromissos', c.id); await DB.apagar('laser', dia.id); fecharModal(); aviso('Dia excluído.'); location.hash = '#/laser'; }; modalCorpo.querySelector('#lsalvar').onclick = async () => { const cidade = modalCorpo.querySelector('#lcidade').value.trim(); if(!cidade){ aviso('Informe a cidade.'); return; } const data = modalCorpo.querySelector('#ldata').value || hoje(); const reg = {...dia, cidade, data, local: modalCorpo.querySelector('#llocal').value.trim(), obs: modalCorpo.querySelector('#lobs').value.trim()}; await DB.gravar('laser', reg); const compExistente = (await DB.por('compromissos','laserId',reg.id))[0]; const comp = compExistente || {id:id(), laserId:reg.id, dataFim:'', horaIni:'', horaFim:'', criadoEm:Date.now()}; await DB.gravar('compromissos', {...comp, titulo:`Laser — ${cidade}`, data, diaInteiro:true}); fecharModal(); aviso(novo ? 'Dia criado.' : 'Dia salvo.'); if(location.hash === '#/laser/' + reg.id) telaLaserDia(reg.id); else location.hash = '#/laser/' + reg.id; }; } async function telaLaserDia(did){ const dia = await DB.ler('laser', did); if(!dia){ tela.innerHTML = `<div class="vazio"><h2>Dia não encontrado</h2><p>Este registro não existe.</p></div>`; return; } const pessoas = (dia.pessoas || []).slice().sort((a,b) => (a.hora || '99:99').localeCompare(b.hora || '99:99')); const atendidas = pessoas.filter(x => x.status === 'atendida'); const recebido = atendidas.reduce((t,x) => t + (x.valorCentavos || 0), 0); const previsto = pessoas.filter(x => x.status !== 'atendida' && x.status !== 'faltou').reduce((t,x) => t + (x.valorCentavos || 0), 0); const SELOS_LASER = {atendida:'<span class="selo">atendida</span>', faltou:'<span class="selo perigo">faltou</span>'}; const ROTULOS_LASER = {marcar:'A confirmar', confirmada:'Confirmada', atendida:'Atendida', faltou:'Faltou'}; const lembretePessoa = pe => { const w = zap(pe.telefone); if(!w) return ''; const primeiro = pe.nome.split(' ')[0]; const txt = `Oi ${primeiro}! Confirmando seu horário de depilação a laser ${quandoBR(dia.data)}${pe.hora ? ' às ' + pe.hora : ''} em ${dia.cidade} 😊`; return `<a class="btn claro" href="${w}?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener" style="padding:7px 14px;font-size:13px;flex:none" onclick="event.stopPropagation()">Lembrar</a>`; }; tela.innerHTML = `<a href="#/laser" class="btn texto" style="margin-bottom:18px;padding-left:0">${ICO.volta}Laser</a><div class="cabecalho"><div><h1>${esc(dia.cidade)}</h1><p class="sub">${dataBR(dia.data)}${dia.local ? ' · ' + esc(dia.local) : ''}</p></div><div style="display:flex;gap:8px"><button class="btn claro" id="editarDiaLaser">Editar dia</button><button class="btn" id="agendarPessoaLaser">${ICO.mais}Agendar</button></div></div>${dia.obs ? `<p class="sub" style="margin:-14px 0 22px;white-space:pre-wrap">${esc(dia.obs)}</p>` : ''}<div class="grade3"><div class="cartao" style="padding:24px 22px"><div class="etiqueta">Agendadas</div><div class="num">${pessoas.length}</div></div><div class="cartao" style="padding:24px 22px"><div class="etiqueta">Atendidas</div><div class="num">${atendidas.length}</div></div><div class="cartao" style="padding:24px 22px"><div class="etiqueta">Recebido no dia</div><div class="num" style="font-size:28px;margin-top:16px">${moeda(recebido)}</div></div></div>${previsto > 0 ? `<p class="sub" style="margin-top:14px">Previsto para o dia: ${moeda(previsto)}</p>` : ''}<div class="etiqueta" style="margin:28px 0 10px">Pessoas marcadas</div>${!pessoas.length ? `<div class="vazio"><h2>Ninguém marcado ainda</h2><p>Monte a agenda deste dia com o botão Agendar.</p></div>` : `<div class="lista">${pessoas.map(pe => `<div class="linha" data-pid="${pe.id}"><div class="ret" style="font-size:11px">${pe.hora || '—'}</div><div style="flex:1"><b>${esc(pe.nome)}</b>${SELOS_LASER[pe.status] || ''}${pe.pessoaId ? `<a href="#/laser/pessoa/${pe.pessoaId}" onclick="event.stopPropagation()" style="margin-left:8px;font-size:11.5px;color:var(--cinza)">histórico</a>` : ''}<br><small>${[pe.area, pe.valorCentavos ? moeda(pe.valorCentavos) : '', ROTULOS_LASER[pe.status] || ''].filter(Boolean).join(' · ')}</small></div>${lembretePessoa(pe)}</div>`).join('')}</div>`}`; tela.querySelector('#editarDiaLaser').onclick = () => formDiaLaser(dia); tela.querySelector('#agendarPessoaLaser').onclick = () => formPessoaLaser(dia); tela.querySelectorAll('[data-pid]').forEach(l => l.onclick = () => { const pe = (dia.pessoas || []).find(x => x.id === l.dataset.pid); if(pe) formPessoaLaser(dia, pe); }); } function formPessoaLaser(dia, pessoa){ const novo = !pessoa; const pe = pessoa || {id:id(), hora:'', nome:'', telefone:'', area:'', valorCentavos:0, status:'marcar', obs:'', receitaId:''}; abrirModal(`<div class="topo"><h2>${novo ? 'Agendar pessoa' : 'Editar pessoa'}</h2></div><div class="dupla"><label class="campo"><span>Hora</span><input id="phora" type="time" value="${esc(pe.hora)}"></label><label class="campo"><span>Nome</span><input id="pnome" value="${esc(pe.nome)}" autocomplete="off"><div id="psug"></div><div id="pjahouve" class="sub" style="margin-top:6px"></div></label><label class="campo"><span>Telefone/WhatsApp</span><input id="ptel" inputmode="tel" value="${esc(pe.telefone)}"></label><label class="campo"><span>Área</span><input id="parea" placeholder="Ex.: axilas, virilha" value="${esc(pe.area)}"></label><label class="campo"><span>Valor</span><input id="pvalor" inputmode="decimal" value="${pe.valorCentavos ? valorTexto(pe.valorCentavos) : ''}" placeholder="0,00"></label><label class="campo"><span>Situação</span><select id="psit"><option value="marcar" ${pe.status === 'marcar' ? 'selected' : ''}>A confirmar</option><option value="confirmada" ${pe.status === 'confirmada' ? 'selected' : ''}>Confirmada</option><option value="atendida" ${pe.status === 'atendida' ? 'selected' : ''}>Atendida</option><option value="faltou" ${pe.status === 'faltou' ? 'selected' : ''}>Faltou</option></select></label></div><label class="campo"><span>Observações</span><textarea id="pobs">${esc(pe.obs)}</textarea></label><div class="acoes">${novo ? '' : '<button class="btn texto perigo" id="pdel" style="margin-right:auto">Excluir</button>'}<button class="btn texto" id="pcanc">Cancelar</button><button class="btn" id="psalvar">Salvar</button></div>`); modalCorpo.querySelector('#pcanc').onclick = fecharModal;

  /* sugere quem já foi atendida antes, para o histórico não se partir em nomes soltos */
  let vinculo = pe.pessoaId || '';
  (async () => {
    await ligarPessoasLaser();
    const conhecidas = await DB.todos('laserPessoas');
    const campoNome = modalCorpo.querySelector('#pnome');
    const caixaSug = modalCorpo.querySelector('#psug');
    const aviso2 = modalCorpo.querySelector('#pjahouve');

      if(!s.length){ aviso2.textContent = 'Já cadastrada · primeira sessão'; return; }
      const areas = porArea(s).slice(0, 3)
        .map(a => `${a.area} ${a.n + 1}ª · última há ${diasDesde(a.ultima)} dias`).join(' | ');
      aviso2.innerHTML = `<span style="color:var(--verde);font-weight:600">${s.length} sessão${s.length > 1 ? 'ões' : ''}</span> · ${esc(areas)}`;
    };

    const escolher = p2 => {
      vinculo = p2.id;
      campoNome.value = p2.nome;
      if(p2.telefone && !modalCorpo.querySelector('#ptel').value) modalCorpo.querySelector('#ptel').value = p2.telefone;
      caixaSug.innerHTML = '';
      mostrarHistorico();

    campoNome.oninput = () => {
      vinculo = '';

      const t = chaveNome(campoNome.value);

      const exata = conhecidas.find(p2 => chaveNome(p2.nome) === t);
      if(exata){ vinculo = exata.id; mostrarHistorico(); }
      caixaSug.innerHTML = (achou.length && !exata)
        ? `<div style="border:1px solid var(--linha);border-radius:var(--r);margin-top:6px;overflow:hidden">
            ${achou.map(p2 => `<button type="button" data-sug="${p2.id}" style="display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;font-size:13.5px;cursor:pointer">
              <b>${esc(p2.nome)}</b>${p2.cidade ? ` <span style="color:var(--cinza)">· ${esc(p2.cidade)}</span>` : ''}</button>`).join('')}
          </div>` : '';
      caixaSug.querySelectorAll('[data-sug]').forEach(b => b.onclick = () => escolher(conhecidas.find(p2 => p2.id === b.dataset.sug)));
    };
    mostrarHistorico();
  })();

  const del = modalCorpo.querySelector('#pdel'); if(del) del.onclick = async () => { if(!await confirmar(`Excluir ${pe.nome} deste dia?`)) return; const atual = await DB.ler('laser', dia.id); atual.pessoas = (atual.pessoas || []).filter(x => x.id !== pe.id); await DB.gravar('laser', atual); fecharModal(); aviso('Pessoa excluída.'); telaLaserDia(dia.id); }; modalCorpo.querySelector('#psalvar').onclick = async () => { const nome = modalCorpo.querySelector('#pnome').value.trim(); if(!nome){ aviso('O nome é obrigatório.'); return; } const telefone = modalCorpo.querySelector('#ptel').value.trim();

    /* cria ou reaproveita o registro da pessoa, para o histórico se manter ligado */

    if(!ficha){

      ficha = {...ficha, nome, telefone: telefone || ficha.telefone};

    }
    pessoaId = ficha.id;

    const reg = {...pe, nome, pessoaId, hora: modalCorpo.querySelector('#phora').value, telefone, area: modalCorpo.querySelector('#parea').value.trim(), valorCentavos: dinheiro(modalCorpo.querySelector('#pvalor').value), status: modalCorpo.querySelector('#psit').value, obs: modalCorpo.querySelector('#pobs').value.trim()}; const atual = await DB.ler('laser', dia.id); const lista = atual.pessoas || []; const i = lista.findIndex(x => x.id === reg.id); if(i === -1) lista.push(reg); else lista[i] = reg; atual.pessoas = lista; await DB.gravar('laser', atual); fecharModal(); aviso('Pessoa salva.'); if(reg.status === 'atendida' && reg.valorCentavos > 0 && !reg.receitaId){ if(await perguntar('Registrar pagamento', `Lançar ${moeda(reg.valorCentavos)} de ${reg.nome} no Financeiro?`, 'Registrar', 'Agora não')){ const rec = {id:id(), data:dia.data, pacienteId:'', procedimento:`Laser ${dia.cidade} — ${reg.nome} (${reg.area})`, valorCentavos:reg.valorCentavos, forma:'pix', status:'recebido', obs:'', criadoEm:Date.now()}; await DB.gravar('receitas', rec); const atual2 = await DB.ler('laser', dia.id); const j = (atual2.pessoas || []).findIndex(x => x.id === reg.id); if(j !== -1){ atual2.pessoas[j].receitaId = rec.id; await DB.gravar('laser', atual2); } } } telaLaserDia(dia.id); }; } 
/* ---------- pessoas do laser: identidade e histórico ----------
   Cada pessoa vira um registro leve em 'laserPessoas'. As sessões continuam
   dentro de cada dia; o vínculo é o campo pessoaId. */
const ROTULOS_LASER = {marcar:'A confirmar', confirmada:'Confirmada', atendida:'Atendida', faltou:'Faltou'};
const chaveNome = n => String(n || '').trim().toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ');

/* Liga as sessões antigas (sem pessoaId) a um registro, agrupando por nome.
   Roda uma vez; depois disso as novas já nascem ligadas. */
async function ligarPessoasLaser(){
  const [dias, pessoas] = await Promise.all([DB.todos('laser'), DB.todos('laserPessoas')]);
  const porNome = new Map(pessoas.map(p => [chaveNome(p.nome), p]));
  let mudou = false;

  for(const dia of dias){
    let alterouDia = false;
    for(const pe of (dia.pessoas || [])){
      if(pe.pessoaId || !pe.nome) continue;
      const k = chaveNome(pe.nome);
      let reg = porNome.get(k);
      if(!reg){
        reg = {id:id(), nome:pe.nome.trim(), telefone:pe.telefone || '', cidade:dia.cidade || '', criadoEm:Date.now()};
        porNome.set(k, reg);
        await DB.gravar('laserPessoas', reg);
        mudou = true;
      } else if(!reg.telefone && pe.telefone){
        reg.telefone = pe.telefone;
        await DB.gravar('laserPessoas', reg);
      }
      pe.pessoaId = reg.id;
      alterouDia = true;
    }
    if(alterouDia) await DB.gravar('laser', dia);
  }
  return mudou;
}

/* Todas as sessões de uma pessoa, da mais recente para a mais antiga. */
async function sessoesDaPessoa(pessoaId){
  const dias = await DB.todos('laser');
  const s = [];
  dias.forEach(d => (d.pessoas || [])
    .filter(pe => pe.pessoaId === pessoaId)
    .forEach(pe => s.push({...pe, data:d.data, cidade:d.cidade, diaId:d.id})));
  return s.sort((a,b) => b.data.localeCompare(a.data) || (b.hora || '').localeCompare(a.hora || ''));
}

/* Conta as sessões atendidas por área. Uma sessão pode ter mais de uma área,
   separadas por vírgula: "axilas, virilha". */
function porArea(sessoes){
  const m = new Map();
  sessoes.filter(s => s.status === 'atendida').forEach(s => {
    String(s.area || '').split(',').map(a => a.trim()).filter(Boolean).forEach(a => {
      const k = a.toLowerCase();
      const at = m.get(k) || {area:a, n:0, ultima:''};
      at.n++;
      if(s.data > at.ultima) at.ultima = s.data;
      m.set(k, at);
    });
  });
  return [...m.values()].sort((a,b) => b.n - a.n);
}

const diasDesde = ds => Math.round((new Date(hoje() + 'T12:00:00') - new Date(ds + 'T12:00:00')) / 86400000);

async function telaLaserPessoas(alvo){
  await ligarPessoasLaser();
  const [pessoas, dias] = await Promise.all([DB.todos('laserPessoas'), DB.todos('laser')]);

  /* contagem e última sessão de cada pessoa, numa passada só */
  const resumo = new Map();
  dias.forEach(d => (d.pessoas || []).forEach(pe => {
    if(!pe.pessoaId) return;
    const r = resumo.get(pe.pessoaId) || {n:0, ultima:''};
    if(pe.status === 'atendida'){ r.n++; if(d.data > r.ultima) r.ultima = d.data; }
    resumo.set(pe.pessoaId, r);
  }));

  const lista = pessoas.sort((a,b) => a.nome.localeCompare(b.nome,'pt-BR'));
  alvo.innerHTML = `
    <div class="busca">${ICO.busca}<input id="qLaser" type="search" placeholder="Buscar pelo nome" autocomplete="off"></div>
    <div id="resLaserPessoas"></div>`;

  const destino = alvo.querySelector('#resLaserPessoas');
  const pintar = termo => {
    const t = chaveNome(termo);
    const vis = t ? lista.filter(p => chaveNome(p.nome).includes(t)) : lista;
    if(!lista.length){
      destino.innerHTML = `<div class="vazio"><h2>Ninguém ainda</h2><p>As pessoas aparecem aqui conforme você as agenda nos dias.</p></div>`;
      return;
    }
    if(!vis.length){
      destino.innerHTML = `<div class="vazio"><h2>Nada encontrado</h2><p>Nenhum nome contém “${esc(termo)}”.</p></div>`;
      return;
    }
    destino.innerHTML = `<div class="lista">${vis.map(p => {
      const r = resumo.get(p.id) || {n:0, ultima:''};
      return `<div class="linha" data-lpes="${p.id}">
        <div class="ret">${esc(iniciais(p.nome))}</div>
        <div style="flex:1"><b>${esc(p.nome)}</b><br>
          <small>${p.cidade ? esc(p.cidade) + ' · ' : ''}${r.n ? `${r.n} sessão${r.n > 1 ? 'ões' : ''}` : 'sem sessão ainda'}${r.ultima ? ` · última ${dataBR(r.ultima)}` : ''}</small></div>
      </div>`;
    }).join('')}</div>`;
    destino.querySelectorAll('[data-lpes]').forEach(l => l.onclick = () => location.hash = '#/laser/pessoa/' + l.dataset.lpes);
  };

  pintar('');
  alvo.querySelector('#qLaser').oninput = e => pintar(e.target.value);
}

async function telaLaserPessoa(pid){

    </div>

      : `<div class="tempo">${sessoes.map(s => `<div class="evento${s.status === 'atendida' ? '' : ' futuro'}">
          <div class="data">${dataBR(s.data)}${s.hora ? ' · ' + s.hora : ''} · ${esc(s.cidade)}</div>
          <h3 style="text-transform:capitalize">${esc(s.area || 'Sessão')}</h3>
          <div class="meta">${[s.valorCentavos ? moeda(s.valorCentavos) : '', ROTULOS_LASER[s.status] || ''].filter(Boolean).join(' · ')}</div>
          ${s.obs ? `<div class="obs" style="margin-top:6px">${esc(s.obs)}</div>` : ''}
          <div style="margin-top:8px"><a class="btn texto" href="#/laser/${s.diaId}" style="padding-left:0">Abrir o dia</a></div>

}

      ${c.assinatura
        ? `<img src="${c.assinatura}" alt="Assinatura" style="display:block;width:100%;max-width:340px;max-height:110px;object-fit:contain">`
        : `<p class="sub" style="margin:0">Ainda não assinada. Ela sai impressa em todo receituário.</p>`}
      <div style="margin-top:14px;display:flex;gap:8px">
        <button class="btn claro" id="cfAssinar">${c.assinatura ? 'Assinar de novo' : 'Assinar agora'}</button>
        ${c.assinatura ? '<button class="btn texto perigo" id="cfLimpar">Remover</button>' : ''}
      </div>
      <label class="marcar" style="margin:16px 0 4px"><input type="checkbox" id="cfImpressa" ${c.assinarImpresso !== false ? 'checked' : ''}>Sair impressa no receituário</label>
      <p class="sub" style="margin:0">Desligue para imprimir com a linha em branco e assinar à caneta.</p>
    </div>
    <p class="sub" style="text-align:right;margin-top:12px" id="cfEstado">Salva sozinho enquanto você escreve.</p>`;

  let timer;
  const salvar = async () => {
    const reg = {...c,
      nome: tela.querySelector('#cfnome').value.trim(),
      titulo: tela.querySelector('#cftit').value.trim(),
      registro: tela.querySelector('#cfreg').value.trim(),
      cidade: tela.querySelector('#cfcid').value.trim(),
      contato: tela.querySelector('#cfcont').value.trim(),
      atualizadoEm: Date.now()};
    Object.assign(c, reg);
    await DB.gravar('config', reg);
    tela.querySelector('#cfEstado').textContent = 'Salvo às ' + new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  };
  tela.querySelectorAll('#cfnome,#cftit,#cfreg,#cfcid,#cfcont').forEach(i =>
    i.oninput = () => { clearTimeout(timer); timer = setTimeout(salvar, 600); });
  const cx = tela.querySelector('#cfImpressa');
  if(cx) cx.onchange = async () => {
    c.assinarImpresso = cx.checked;
    await DB.gravar('config', {...c, atualizadoEm: Date.now()});
    aviso(cx.checked ? 'A assinatura sai impressa.' : 'O papel sai com a linha em branco.');
  };

  tela.querySelector('#cfAssinar').onclick = async () => {
    const ass = await Assinatura.abrir(c.nome || 'Assinatura');
    if(!ass) return;
    c.assinatura = ass;
    await DB.gravar('config', {...c, atualizadoEm: Date.now()});
    aviso('Assinatura salva.'); telaConfig();
  };
  const lim = tela.querySelector('#cfLimpar');
  if(lim) lim.onclick = async () => {
    if(!await confirmar('Remover a assinatura salva?')) return;
    c.assinatura = '';
    await DB.gravar('config', {...c, atualizadoEm: Date.now()});
    aviso('Assinatura removida.'); telaConfig();
  };
}
